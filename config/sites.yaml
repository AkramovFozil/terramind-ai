# TerraMind AI — sites and analysis windows.
#
# RULE: a site's center is frozen BEFORE any similarity score is seen.
# Change a center only before `approve`. Changing it afterwards blocks `score`
# until the site is prepared and approved again.

window_km: 25            # ROI = 25 x 25 km square, centered on the site (was 50 km; see docs/methodology.md, decision log)
grid_m: 463              # common matching grid for Mars and Earth (~54 x 54 px = 2,916 px)
hazard_grid_m: 30        # Earth only: native SRTM grid kept for the Phase 2 hazard map
min_valid_pixels: 2500   # a ROI with fewer valid pixels fails
max_nodata_fraction: 0.10

sites:
  gale:
    name: Gale Crater (Aeolis Palus)
    body: mars
    role: reference
    lat: -4.49
    lon: 137.42
    enabled: true
    dataset: MOLA_MEGDR_463m
    # First existing file wins: the global mosaic, or a local clip around Gale.
    dem_paths:
      - data/raw/mars/Mars_MGS_MOLA_DEM_mosaic_global_463m.tif
      - data/raw/mars/gale_mola_463m.tif

  meridiani:
    name: Meridiani Planum (Opportunity landing site)
    body: mars
    role: reference
    lat: -1.9462    # Eagle crater, where Opportunity landed (1.9462 S, 354.4734 E)
    lon: -5.5266    # = 354.4734 E in the -180..180 convention of the MOLA mosaic
    enabled: true
    dataset: MOLA_MEGDR_463m
    note: >-
      Added 2026-11-14 as a second Mars reference: one of the flattest landing
      plains on Mars. Declared before any Meridiani score was computed.
    dem_paths:
      - data/raw/mars/Mars_MGS_MOLA_DEM_mosaic_global_463m.tif

  mouton:
    name: Mons Mouton Plateau (Moon, Artemis III candidate region)
    body: moon
    role: reference
    lat: -84.7906   # IM-2 Athena landing point on the plateau (84.7906 S, 29.1957 E), 6 March 2025
    lon: 29.1957
    enabled: true
    dataset: LOLA_SPOLE_80M
    note: >-
      One of NASA's nine Artemis III candidate landing regions (Oct 2024), near the
      lunar south pole. Window centered on the IM-2 Athena landing point. Added
      2026-11-14 when the team's challenge (Moon base and Mars analogs) was confirmed.
    dem_paths:
      - data/raw/moon/LDEM_80S_80MPP_ADJ.TIF

  ustyurt:
    name: Ustyurt Plateau
    body: earth
    role: candidate
    lat: 43.6510
    lon: 56.1800
    provisional: false
    note: >-
      Center fixed on 2026-11-14 after the quick-look and before any score:
      moved from 56.128 to 56.180 deg E so the whole 25 km window lies in
      Uzbekistan (the border follows the 56th meridian here).
    enabled: true
    dataset: SRTMGL1

  kyzylkum:
    name: Kyzylkum Desert
    body: earth
    role: candidate
    lat: null   # TBD by the team: inside the desert, away from rivers, fields, towns and mines
    lon: null
    enabled: false
    dataset: SRTMGL1

  yungay:
    name: Yungay, Atacama (Chile)
    body: earth
    role: validation
    lat: -24.0848
    lon: -69.9151
    enabled: true    # Phase 2: known Mars analog, scored with the same settings
    dataset: SRTMGL1

  mdrs:
    name: MDRS, Utah (USA)
    body: earth
    role: validation
    lat: 38.4062
    lon: -110.7894
    enabled: true    # Phase 2: known Mars analog, scored with the same settings
    dataset: SRTMGL1
