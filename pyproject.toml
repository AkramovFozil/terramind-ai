[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terramind"
version = "0.1.0"
description = "TerraMind AI — DEM-based terrain matching between Earth and Mars (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyproj>=3.4",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
terramind = "terramind.cli:main"

[tool.setuptools.packages.find]
include = ["terramind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
